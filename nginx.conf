server {
  listen 80;

  root /usr/share/nginx/html;
  index index.html;

  # Allow iframe embedding from Genesys Cloud (apps.mypurecloud.jp)
  add_header Content-Security-Policy "frame-ancestors https://apps.mypurecloud.jp https://*.mypurecloud.jp;" always;
  add_header X-Frame-Options "" always;

  location / {
    try_files $uri /index.html;
  }
}